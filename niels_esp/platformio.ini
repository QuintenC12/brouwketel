; Niels ESP - ESP32-S3 die de sensor, SSR, pomp, zoemer en MQTT doet
; en via een seriële kabel praat met het scherm (CrowPanel).
;
;   cd niels_esp
;   pio run -t upload -t monitor
;
; Wifi-naam en wachtwoord: kopieer include/geheim.h.voorbeeld naar
; include/geheim.h en vul ze in (geheim.h gaat niet mee naar GitHub).

[env:niels_esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
