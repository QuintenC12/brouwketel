; Brouwcontroller - EEZ Studio (zonder Flow) + LVGL 9
;
; Twee omgevingen:
;   crowpanel7 - firmware voor de Elecrow CrowPanel 7.0" (ESP32-S3, 800x480)
;                pio run -e crowpanel7 -t upload -t monitor
;   crowpanel7_demo - firmware voor de CrowPanel, maar met de nep-ketel en nep-server
;                uit de simulator: zo test je alle schermen op het echte scherm
;                pio run -e crowpanel7_demo -t upload -t monitor
;   simulator  - dezelfde UI in een venster op je Mac (vereist: brew install sdl2)
;                pio run -e simulator -t exec

[platformio]
default_envs = crowpanel7
boards_dir = boards

; ---------------------------------------------------------------------------
; Elecrow CrowPanel 7.0" (DIS08070H) - ESP32-S3-WROOM-1-N4R8
; Platform- en Arduino-versie zoals in Elecrow's officiële PlatformIO-voorbeeld
; ---------------------------------------------------------------------------
[env:crowpanel7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
board = crowpanel7
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<*> -<sim/>

lib_deps =
    lvgl/lvgl@~9.2.2
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I .pio/libdeps/crowpanel7

; ---------------------------------------------------------------------------
; Demo op de echte CrowPanel: scherm en touch echt, ketel/sensor/server nagebootst
; (sim/sim_hardware.cpp in plaats van hardware.cpp). De tijd loopt 30x sneller,
; net als in de simulator.
; ---------------------------------------------------------------------------
[env:crowpanel7_demo]
extends = env:crowpanel7
build_src_filter = +<*> -<hardware.cpp> -<sim/sim_main.cpp>
; eigen libdeps-map: PlatformIO installeert LVGL per omgeving in .pio/libdeps/<naam>
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I .pio/libdeps/crowpanel7_demo
    -D DEMO

; ---------------------------------------------------------------------------
; Simulator op een Mac met Apple chip (Homebrew installeert in /opt/homebrew)
; ---------------------------------------------------------------------------
[env:simulator]
platform = native
lib_deps =
    lvgl/lvgl@~9.2.2
build_src_filter = +<*> -<main.cpp> -<hardware.cpp> -<board_crowpanel7.cpp>
build_flags =
    -D SIMULATOR
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I .pio/libdeps/simulator
    -I /opt/homebrew/include
    -L /opt/homebrew/lib
    -lSDL2